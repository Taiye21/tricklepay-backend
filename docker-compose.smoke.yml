# Requires Compose 2.24.4+ for !override. Reuse the production image,
# command and health check with an isolated test-profile database.
services:
  postgres-test:
    extends:
      file: docker-compose.yml
      service: postgres-test
    container_name: !reset null
    ports: !reset []
    volumes: !reset []

  api:
    extends:
      file: docker-compose.yml
      service: api
    depends_on: !override
      postgres-test:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tricklepay_test:tricklepay_test@postgres-test:5432/tricklepay_test
    ports: !reset []
